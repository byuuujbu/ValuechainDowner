services:
  db:
    image: postgres:16-alpine
    container_name: ovsa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ovsa}
      POSTGRES_USER: ${POSTGRES_USER:-ovsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ovsa_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ovsa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ovsa} -d ${POSTGRES_DB:-ovsa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ovsa-api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ovsa}
      POSTGRES_USER: ${POSTGRES_USER:-ovsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ovsa_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATA_PROVIDER_MODE: ${DATA_PROVIDER_MODE:-sample}
      FMP_API_KEY: ${FMP_API_KEY:-}
      FMP_BASE_URL: ${FMP_BASE_URL:-https://financialmodelingprep.com/stable}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      DISPLAY_USD_KRW_RATE: ${DISPLAY_USD_KRW_RATE:-}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ovsa-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - api

volumes:
  ovsa_postgres_data:
